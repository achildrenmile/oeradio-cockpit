# Mosquitto 2.1 for oeradio-cockpit (ADR 0001, 0003).
#
# Authentication is bound PER LISTENER with plugin_use. Never switch to the global
# password_file/acl_file options: the aggregator's write login would then also work
# on the public WebSocket listener.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Limits. Only the aggregator writes, so these mainly bound what clients can pile up.
# message_size_limit caps the payload (the firmware buffer), max_packet_size the whole packet.
message_size_limit 8192
max_packet_size 10240
max_inflight_messages 20
max_queued_messages 100
persistent_client_expiration 1h
global_max_connections 1100
# allow_zero_length_clientid stays at its default (true): an anonymous client without an
# ID gets a random one, which is harmless for read-only access.

plugin_load internal_passwords /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/auth/internal.passwd
plugin_load internal_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl.internal
plugin_load public_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl.public
# Shared device user: uncomment together with the lines in the 9001 block.
#plugin_load device_passwords /usr/lib/mosquitto_password_file.so
#plugin_opt_password_file /mosquitto/auth/device.passwd

# Internal only (cluster network), never published through the tunnel.
listener 1883
listener_allow_anonymous false
plugin_use internal_passwords
plugin_use internal_acl
max_connections 20

# Devices, via the Cloudflare tunnel. Read-only.
listener 9001
protocol websockets
max_connections 1000
plugin_use public_acl
# Variant A (default): anonymous devices.
listener_allow_anonymous true
# Variant B: shared user "device". Replace the line above with these two.
#listener_allow_anonymous false
#plugin_use device_passwords
