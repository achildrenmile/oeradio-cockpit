apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
spec:
  serviceName: mqtt-internal
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Mosquitto wants to own its auth files; mounted ConfigMaps and Secrets belong to root.
        - name: copy-config
          image: eclipse-mosquitto:2.1.4-alpine
          command:
            - sh
            - -c
            - cp -f /src/config/* /mosquitto/config/ && cp -f /src/auth/* /mosquitto/auth/ && chmod 0400 /mosquitto/config/* /mosquitto/auth/*
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config-source, mountPath: /src/config, readOnly: true}
            - {name: auth-source, mountPath: /src/auth, readOnly: true}
            - {name: config, mountPath: /mosquitto/config}
            - {name: auth, mountPath: /mosquitto/auth}
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.1.4-alpine
          command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - {name: mqtt, containerPort: 1883}
            - {name: ws, containerPort: 9001}
          readinessProbe:
            tcpSocket: {port: ws}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: ws}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /mosquitto/config, readOnly: true}
            - {name: auth, mountPath: /mosquitto/auth, readOnly: true}
            - {name: data, mountPath: /mosquitto/data}
      volumes:
        - name: config-source
          configMap:
            name: mosquitto-config
        - name: auth-source
          secret:
            secretName: mosquitto-auth
            defaultMode: 0440
        - name: config
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: auth
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-internal
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - {name: mqtt, port: 1883, targetPort: mqtt}
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-ws
spec:
  selector:
    app.kubernetes.io/name: mosquitto
  ports:
    - {name: ws, port: 9001, targetPort: ws}
