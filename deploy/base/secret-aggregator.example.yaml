# Do not fill in and commit. Create it in the private GitOps repo (SOPS / Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: aggregator-secrets
  namespace: oeradio-cockpit
stringData:
  # Same password that was hashed into mosquitto-auth.
  COCKPIT_BROKER_PASSWORD: "<password>"
  # Needed for the dx source:
  # COCKPIT_DX_CALLSIGN: "<callsign-ssid>"
  # Needed for the mesh source (the host is private, so it belongs here):
  # COCKPIT_MESH_HOST: "<observer broker host>"
  # COCKPIT_MESH_USER: "<user>"
  # COCKPIT_MESH_PASSWORD: "<password>"
