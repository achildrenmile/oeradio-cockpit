# Do not fill in and commit. Create it in the private GitOps repo, encrypted with SOPS or
# Sealed Secrets. Hashes come from mosquitto_passwd (see ../mosquitto/passwd.example).
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-auth
  namespace: oeradio-cockpit
stringData:
  internal.passwd: |
    aggregator:<hash from mosquitto_passwd>
  # Only for the shared device user (variant B in mosquitto.conf):
  # device.passwd: |
  #   device:<hash from mosquitto_passwd>
