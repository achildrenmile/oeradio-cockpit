name: Wunsch
description: Neue Funktion oder Verbesserung vorschlagen
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Wie stellst du dir die Lösung vor?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen oder weitere Hinweise
